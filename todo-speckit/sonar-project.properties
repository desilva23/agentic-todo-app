# Read by SonarQube / SonarCloud (sonar-scanner). Generate the reports first:
#   python -m pytest --cov --cov-report=xml --junitxml=test-results.xml
sonar.projectKey=todo-app-speckit
sonar.projectName=Todo App (Spec Kit build)
sonar.projectVersion=1.0

sonar.sources=app,static
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.exclusions=**/__pycache__/**,**/.venv/**,htmlcov/**

sonar.python.version=3.10,3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.sourceEncoding=UTF-8
